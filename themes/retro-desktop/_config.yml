  - 编程
  - 生活随笔

# 导航（主页固定在最前）
nav:
  - name: 归档
    url: /archives
  - name: 展示册
    url: /showcase
  - name: 关于我
    url: /me
  - name: 友链
    url: /friends

# 自建评论系统（server/comments-server.js）
# api 填评论服务的「站点根地址」（不要带 /api，前端自己拼）：本地开发填 http://127.0.0.1:8765
# 线上用 https://060929.xyz（Nginx 在 443 上把 /api/ 反代到本机 127.0.0.1:8765）
comments:
  enable: true
  api: https://060929.xyz        # 站点根地址，不要带 /api；本地开发改成 http://127.0.0.1:8765        # 主题会自动去掉结尾的 /api；前端拼 /api/comments、/api/view…

# Giscus 评论（已弃用，保留字段仅作备忘）
giscus:
  repo: ''
  repo_id: ''
  category: ''
  category_id: ''
  mapping: pathname
  reactions: '1'
  theme: light

# 友链（在友链页展示；按下面的格式添加）
# friends:
#   - name: 站名
#     url: https://example.com
#     desc: 一句话简介
# 友链：也可以留空 []，让访客在 /friends/ 在线申请、后台审核
friends: []

